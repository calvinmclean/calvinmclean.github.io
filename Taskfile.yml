version: "3"
tasks:
  generate-content:
    cmds:
      - go run ./cmd/generate-content
  serve:
    deps: [generate-content]
    cmds:
      - hugo server --disableFastRender
  build:
    deps: [generate-content]
    cmds:
      - hugo --minify
  new-article:
    silent: true
    cmds:
      - mkdir {{.CLI_ARGS}}
      - touch {{.CLI_ARGS}}/article.md
      - |
        cat > {{.CLI_ARGS}}/article.json << EOF
        {
          "title": "{{.CLI_ARGS}}",
          "description": ""
        }
        EOF
    status:
      - test -d {{.CLI_ARGS}}
